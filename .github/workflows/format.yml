name: format

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same restore source as ci.yml. Without it the workspace loads with no package references
      # and no analyzers, so analyzer warnings cannot fail this job.
      - name: Restore
        run: dotnet restore BGPLite.sln --source https://api.nuget.org/v3/index.json

      # Fails the check if `dotnet format` would change anything.
      # Run `dotnet format BGPLite.sln` locally if this check fails.
      - name: Verify formatting
        run: dotnet format BGPLite.sln --verify-no-changes --severity warn --no-restore
