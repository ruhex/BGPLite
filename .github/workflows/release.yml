name: Release

# release-please: manages version + tag + GitHub Release from Conventional Commits.
#   feat:     -> minor (e.g. 1.2.3 -> 1.3.0)
#   fix:      -> patch (e.g. 1.2.3 -> 1.3.0... wait: 1.2.4)
#   feat!/fix! or "BREAKING CHANGE:" footer -> major
#   chore:/docs:/ci: -> no release
# It opens a "release PR" that accumulates the changelog; merging that PR tags
# vX.Y.Z and publishes the Release (which triggers release-assets.yml).
#
# Manifest mode: the current version is read from .release-please-manifest.json.
# Without it, release-please infers the last release from the recent history only
# (about 250 commits deep) — past that depth it finds none and proposes 1.0.0
# (#652). release-please-config.json also widens both search depths.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
