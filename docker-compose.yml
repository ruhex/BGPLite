# Example deployment for the BGPLite route-server.
#
# Config is NOT baked into the image — mount your real appsettings.yml from the host
# (keeps secrets out of the image). See appsettings.Example.yml for the schema.
#
# BGP peers must reach the server's real TCP/179, so on Linux this uses host networking
# (simplest for peering). If you prefer bridge networking, drop `network_mode: host`,
# map `ports: ["179:179","5000:5000"]`, and add `cap_add: [NET_BIND_SERVICE]`
# (port 179 < 1024) or run a reverse-proxy/port-remapper.
#
# SECURITY (#90): the management API binds to 127.0.0.1 by default (loopback only).
# With `network_mode: host`, it is reachable only from the same host — put an authenticated
# reverse proxy (Caddy/nginx with TLS + auth) in front. To expose it directly, set
# `ApiListen: "0.0.0.0"` in appsettings.yml — but you MUST provide auth at the proxy layer.
services:
  bgplite:
    image: ghcr.io/ruhex/bgplite:latest
    build: .
    container_name: bgplite
    network_mode: host
    volumes:
      - ./appsettings.yml:/app/appsettings.yml:ro
      - ./data:/app/data
    restart: unless-stopped
    # Must outlast the host's own shutdown budget, which is SHARED and not additive:
    # HostOptions.ShutdownTimeout (left at its default) gives the host 30 s to stop every hosted
    # service, and each StopAsync is handed a token that fires when that budget runs out. So
    # ManagementApi's 10 s in-flight drain consumes PART of those 30 s, and BgpServer's session
    # teardown — which runs after it, because services stop in reverse registration order — gets
    # whatever remains. Docker's default 10 s SIGTERM->SIGKILL deadline lands in the middle of that,
    # so the process was killed mid-teardown. 45 s gives a clear margin over the host's budget so
    # the host, not Docker, stays the authority on when to give up.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
